services:
  osgate:
    build: .
    image: ghcr.io/ogsvnv/osgate:1.0.0
    container_name: osgate
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OSGATE_HOST_WEB_PORT:-5812}:5812"
      - "${OSGATE_HOST_SOCKS_BIND:-127.0.0.1}:${OSGATE_HOST_SOCKS_PORT:-1080}:1080"
    volumes:
      - ./data:/data
      - ./ssh:/ssh:ro
    env_file: .env
    environment:
      # Host localhost reaches this app via Docker bridge gateway.
      WEB_ALLOWED_CIDRS: "${DOCKER_WEB_ALLOWED_CIDRS:-127.0.0.1/32,::1/128,172.16.0.0/12}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m
    healthcheck:
      test: ["CMD", "python", "-m", "osgate.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
